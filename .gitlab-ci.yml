# yasrt releases itself with yasrt (docs/design/plan.md, P6).
#
# Note the stage order: version -> build -> release. The tag is cut *after* the
# artefacts exist, which is the whole point of this tool. It also has to be
# this way here: pushes made with CI_JOB_TOKEN do not start pipelines, so a
# tag-triggered build would never run. Image repositories migrating to yasrt
# have to make the same move — see docs/design/plan.md risk R8.
stages: [quick, test, version, build, release, sign]

variables:
  GIT_DEPTH: 0
  GIT_STRATEGY: clone
  GO_IMAGE: registry.ole-hartwig.eu/devops/images/golang:1.27
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOPATH: ${CI_PROJECT_DIR}/.go

include:
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/composed-default-pipelines/go@1
    inputs:
      working-directory: .
      go-image: registry.ole-hartwig.eu/devops/images/golang:1.27
      test-args: "-race -coverprofile=coverage.out ./..."
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/lint-tools/lint-ci-yaml@1
    inputs:
      stage: "test"
      job-name: "lint:ci-yaml"
      targets: ".gitlab-ci.yml"
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/supply-chain-verify/base-image-pins@2
  # yasrt releases yasrt through the component that yasrt ships. The image
  # carries the last released version and cuts the next one, which is what
  # dogfooding is supposed to mean — and it makes this repository the first
  # consumer of release-tools/yasrt, so the component is exercised rather than
  # only the binary.
  # This repository decides and publishes its own release with the binary
  # under test, not with the released image: the image carries the previous
  # version, and the first configuration key the new version introduces --
  # and this repository uses -- would otherwise fail its own release. The
  # component's jobs stay (defaults layer, rules, artefacts); only the image
  # and the command are replaced below.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/release-tools/yasrt@1
    inputs:
      stage-version: version
      stage-release: release
      yasrt-image: registry.ole-hartwig.eu/devops/images/golang:1.27

.go-base: &go-base
  image: $GO_IMAGE
  cache:
    key:
      files: [go.sum]
    paths: [.go/pkg/mod]
  before_script:
    # devops/images/golang carries the Go toolchain and build-base, no git.
    # yasrt's tests drive the real git binary on purpose — every rule it
    # implements is defined against git's own behaviour, so a fake would only
    # prove the fake works. Installing it here keeps the shared image
    # unchanged; if a second Go repository needs it, it belongs in the image.
    - apk add --no-cache git

# yasrt has no golangci-lint or govulncheck precedent in this estate to inherit;
# both are introduced here rather than in the shared Go component, so the two
# other Go consumers are not affected. See docs/design/plan.md R7.
lint:golangci:
  <<: *go-base
  stage: test
  # Pinned v2.6.2 could not read Go 1.27 export data ("export data version 4 is
  # greater than maximum supported version 2") and reported the whole standard
  # library as unimportable. Tracking latest until a release is known to
  # understand 1.27; advisory either way, which is why it may fail.
  script:
    - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run --timeout 5m
  allow_failure: true

# The estate's stated gate is 75 % line coverage (engineering/quality-gates.md).
# It is expressed there for PHP via Cobertura; Go reports through GitLab's
# coverage: regex instead, so the threshold is enforced here explicitly.
test:coverage:gate:
  <<: *go-base
  stage: test
  needs: []
  variables:
    COVERAGE_MINIMUM: "75.0"
  script:
    - go test -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
    - |
      total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')"
      echo "total coverage ${total}% (minimum ${COVERAGE_MINIMUM}%)"
      awk -v t="$total" -v m="$COVERAGE_MINIMUM" 'BEGIN { exit (t+0 >= m+0) ? 0 : 1 }'
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths: [coverage.out]
    expire_in: 7 days

test:govulncheck:
  <<: *go-base
  stage: test
  # vuln.go.dev is IPv4-only and the general pool is IPv6-only, so the database
  # fetch times out there. az1a is the estate's IPv4-capable pool, used for the
  # same reason by devops/images/code-signing and deploy-opkssh.
  tags: [az1a]
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

# The shared Go component cannot know that this repository's tests need git;
# its own before_script only changes directory, so both have to be restated.
test:go:
  before_script:
    - apk add --no-cache git
    - cd .

# ---------------------------------------------------------------------------
# The release handshake.
# ---------------------------------------------------------------------------

# GitLab evaluates rules: at pipeline creation, before .release.env exists, so
# downstream jobs check RELEASE_STATUS in the script rather than in rules:.
.needs-release: &needs-release
  - '[ "$RELEASE_STATUS" = "release" ] || { echo "skip: ${RELEASE_STATUS:-unknown}"; exit 0; }'

build:binaries:
  <<: *go-base
  stage: build
  needs: [version]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - *needs-release
    - mkdir -p dist
    # linux for the runners, darwin for the developer who runs `yasrt next`
    # by hand. Windows is not built: untested, and the hook runner assumes a
    # POSIX shell.
    - |
      for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
        CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" \
          -o "dist/yasrt-${target%/*}-${target#*/}" ./cmd/yasrt
      done
    - cd dist && sha256sum yasrt-* > SHA256SUMS && cat SHA256SUMS
  artifacts:
    paths: [dist/]
    expire_in: 1 day

upload:package-registry:
  stage: build
  needs: [version, build:binaries]
  # The golden image, not the mirror: the mirror publishes no :latest, and
  # S3mail's release jobs already use this one. 8.21 is the rolling curl stream
  # tag, the same shape as devops/images/golang:1.27.
  # renovate: datasource=docker depName=registry.ole-hartwig.eu/devops/images/curl
  image: registry.ole-hartwig.eu/devops/images/curl:8.21
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  variables:
    PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/yasrt"
  script:
    - *needs-release
    # release-cli is deliberately unused: its image lives on an IPv4-only host
    # the runners cannot reach. The API does the same job, and curl is here.
    - cd dist
    - |
      for f in yasrt-linux-amd64 yasrt-linux-arm64 yasrt-darwin-arm64 yasrt-darwin-amd64 SHA256SUMS; do
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PACKAGE_URL}/${RELEASE_VERSION}/${f}"
      done

# Both release jobs run the binary built from this very commit. `go build`
# rather than `go run`, so the build error and the decision are two lines.
version:
  cache:
    key:
      files: [go.sum]
    paths: [.go/pkg/mod]
  script:
    - apk add --no-cache git
    - go build -o /tmp/yasrt ./cmd/yasrt
    - /tmp/yasrt next --output .release.env

# The component's release job needs this repository's build, which is named
# build:binaries here rather than `build`.
release:
  needs: [version, build:binaries, upload:package-registry]
  script:
    - '[ "$RELEASE_STATUS" = "release" ] || { echo "skip: ${RELEASE_STATUS:-unknown}"; exit 0; }'
    - apk add --no-cache git
    - go build -o /tmp/yasrt ./cmd/yasrt
    - /tmp/yasrt release

# The public mirror. A GitLab push mirror copies the repository as it is;
# this one leaves out what is working material of this instance rather than
# part of the project -- the agent guidance and the allowed-signers list --
# by rewriting the history without those paths and force-pushing the result.
# git filter-repo is deterministic, so the rewritten commits keep their ids
# from run to run and the tags on GitHub stay put once published. Runs after
# `release`, so a tag made in this pipeline is mirrored in the same one; a
# push made with the job token starts no pipeline, so nothing runs twice.
#
# GITHUB_MIRROR_TOKEN is a fine-grained token with contents:write on the
# mirror repository -- the one stored secret this repository has, and it is
# about publishing the project, not about releasing it.
mirror:github:
  stage: .post
  # github.com has no IPv6 and the spot fleet no public IPv4; this runner
  # has both, which is why the image builds run there too.
  tags: [az1a]
  needs:
    - job: release
      optional: true
      artifacts: false
  image:
    name: registry.ole-hartwig.eu/devops/ci-mirrors/python:3-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  rules:
    - if: $GITHUB_MIRROR_TOKEN == null
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - apk add --no-cache git
    - pip install --quiet --root-user-action=ignore git-filter-repo
    - |
      set -eu
      # A fresh clone with every tag: the checkout the runner made has the
      # branch only, and filter-repo wants a clean repository.
      git clone --quiet --mirror "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" /tmp/mirror
      cd /tmp/mirror
      git filter-repo --quiet --invert-paths \
        --path CLAUDE.md --path .gitsigners --path .gitsigners.d --path .gitlab/ \
        --path renovate.json --path .mise.toml --path lefthook.yml
      # Only the default branch and the release tags go public. A loop rather
      # than grep | xargs: grep exits 1 when nothing matches, and under set -e
      # in BusyBox sh that ended the job with nothing to say.
      git for-each-ref --format='%(refname)' refs/heads refs/tags | while read -r ref; do
        case "$ref" in
          "refs/heads/${CI_DEFAULT_BRANCH}"|refs/tags/v*) ;;
          *) git update-ref -d "$ref" ;;
        esac
      done
      echo "publishing $(git rev-parse --short "${CI_DEFAULT_BRANCH}") and tags: $(git tag | tr '\n' ' ')"
      # refs/heads/* with --prune: whatever branch GitHub still has that this
      # repository does not push (only the default branch survives the
      # filter above) is removed, so nothing unfiltered lingers there.
      git push --force --prune "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/ohartwig/yasrt.git" \
        'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
      echo "mirrored to github.com/ohartwig/yasrt"
