# Optional merge-request preview (SPEC §8.3). Prints what would be released if
# this branch were merged, without writing anything.
#
# Destination: devops/ci-cd-components/release-tools/templates/yasrt-preview/template.yml
spec:
  inputs:
    stage:
      default: test
    yasrt-image:
      default: "registry.ole-hartwig.eu/yasrt/cli:1"
    config-path:
      default: ".yasrt.yaml"
---

release:preview:
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.yasrt-image ]]
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
    YASRT_CONFIG: $[[ inputs.config-path ]]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - yasrt next --ref origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME --json | tee preview.json
  artifacts:
    paths: [preview.json]
    expire_in: 7 days
  # A preview is information, never a gate.
  allow_failure: true
