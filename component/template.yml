# yasrt — the release component that replaces `semantic-release`.
#
# Destination: devops/ci-cd-components/release-tools/templates/yasrt/template.yml
# It ships beside the semantic-release template rather than replacing it, so a
# repository migrates by changing one path segment and can change it back.
#
# Five inputs remain of the old fourteen. Dropped without replacement:
# config-preset, config-preset-group-id, config-preset-scope (there is no npm
# preset any more — .yasrt.yaml is per repository), image-config (yasrt ships
# its own image), tags-config, signing-name and signing-email (both live in
# .yasrt.yaml under release_commit.author).
spec:
  inputs:
    stage-version:
      default: version
      description: Stage for the read-only analysis.
    stage-release:
      default: release
      description: Stage for the publishing job. Must come after the build.
    yasrt-image:
      default: "registry.ole-hartwig.eu/devops/yasrt:1"
      description: Image carrying the yasrt binary, git and gpg.
    config-path:
      default: ".yasrt.yaml"
      description: Path to the repository's yasrt configuration.
    gpg-key-var:
      default: "GPG_SEM_REL_B64"
      description: Variable holding the base64-encoded signing key. Optional.
    rules-config:
      type: array
      default:
        - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"
      description: >
        Rules for both jobs. The default is narrower than the old component's,
        because yasrt no longer needs a changes: guard: pushes made with
        CI_JOB_TOKEN start no pipeline, the release scope is always ignored,
        and CHANGELOG.md is a non-release path in every product derivation.
---

.yasrt-base:
  image: $[[ inputs.yasrt-image ]]
  variables:
    # yasrt refuses to analyse a shallow clone: a missing tag or commit changes
    # the answer silently, which is how the old chain lost releases.
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
    YASRT_CONFIG: $[[ inputs.config-path ]]
  rules: $[[ inputs.rules-config ]]

version:
  extends: .yasrt-base
  stage: $[[ inputs.stage-version ]]
  script:
    - yasrt next --output .release.env
  artifacts:
    reports:
      dotenv: .release.env
    expire_in: 1 day

release:
  extends: .yasrt-base
  stage: $[[ inputs.stage-release ]]
  # `build` comes from the consuming repository: the tag confirms an artefact
  # that already exists rather than announcing one that might.
  needs: [version, build]
  resource_group: release
  script:
    # GitLab evaluates rules: before .release.env exists, so the status is
    # checked here rather than in rules:.
    - '[ "$RELEASE_STATUS" = "release" ] || { echo "skip: ${RELEASE_STATUS:-unknown}"; exit 0; }'
    - yasrt release
  artifacts:
    paths: [release-report.json]
    when: always
    expire_in: 30 days
