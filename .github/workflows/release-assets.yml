#
# Release assets on GitHub. The release itself is cut on the author's GitLab,
# where the pipeline runs; the mirror brings the tag here, and this workflow
# turns the tag into a GitHub release with the binaries built from it -- so
# `go install` and the download links in the README both work from GitHub.
# Nothing here decides anything: the tag already exists, and a tag that was
# not made by the release pipeline does not reach this repository.

name: release assets
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/yasrt-${target%/*}-${target#*/}" ./cmd/yasrt
          done
          (cd dist && sha256sum yasrt-* > SHA256SUMS && cat SHA256SUMS)
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Notes come from the changelog entry for this version, which the
          # release pipeline committed right after the tag.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Release ${GITHUB_REF_NAME}." > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
