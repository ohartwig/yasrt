# yasrt releases yasrt. See docs/design/plan.md, phase P6.
version: 1

# custom rather than image: this repository ships a binary to the package
# registry *and* an image, and its own pipeline is part of neither.
product: custom

# v-prefixed since 1.7.0: Go modules resolve versions only from tags that carry
# the prefix, so `go install …@v1.7.0` needs it. The bare tags up to 1.6.1 stay
# what they are and are still recognised as releases.
tag_format: "v${version}"
versioning:
  previous_tag_formats: ["${version}"]

# Own rules instead of the shared defaults' chore -> patch. Every change that
# reaches the binary arrives as fix(deps) (Go image tag, modules) or as
# feat/fix; chore and ci commits here are CI digest pins and repo-template
# syncs. Under the default they cut v1.13.2, .4, .5 and .7 with nothing in
# them for a user. Lists replace the defaults, so this is the whole set.
rules:
  - { breaking: true, release: major }
  - { type: feat, release: minor }
  - { type: fix, release: patch }
  - { type: perf, release: patch }
  - { type: revert, release: patch }

deliverability:
  non_release_paths:
    - CHANGELOG.md
    - README.md
    - CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - SECURITY.md
    - docs/**
    - lefthook.yml
    - .gitlab/**
    - .github/**

release_commit:
  enabled: true
  message: "chore(release): ${version}"
  assets: [CHANGELOG.md]
  sign: auto

gitlab_release:
  enabled: true
  name: "${version}"
